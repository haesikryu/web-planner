name: Planner verification
on:
  push:
    branches: [main, build/development-foundation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: planner_test_ci_only
          POSTGRES_DB: planner_test_product
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner_test -d planner_test_product"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANNER_TEST_DATABASE_URL: postgresql://planner_test:planner_test_ci_only@127.0.0.1:5432/planner_test_product
      PLANNER_E2E_DATABASE_URL: postgresql://planner_test:planner_test_ci_only@127.0.0.1:5432/planner_test_e2e
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/prepare-postgres-tests.mjs
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2 --global-timeout=300000
      - run: npm run test:e2e:product -- --workers=2 --global-timeout=600000
      - run: npm run test:e2e:demo -- --workers=2 --global-timeout=600000
